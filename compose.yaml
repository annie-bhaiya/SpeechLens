services:
  speechlens:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SPEECHLENS_STORAGE: /app/storage
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - uploads:/app/storage
      - model_cache:/app/.cache/models
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  uploads:
  model_cache:
